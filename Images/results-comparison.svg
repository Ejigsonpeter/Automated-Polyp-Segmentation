<svg viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
    <!-- Original Image -->
    <rect x="50" y="50" width="120" height="100" fill="#f5f5f5" stroke="#424242" stroke-width="2"/>
    <text x="110" y="90" text-anchor="middle" fill="#424242" font-family="Arial">Original</text>
    <text x="110" y="110" text-anchor="middle" fill="#424242" font-family="Arial">Image</text>

    <!-- Ground Truth -->
    <rect x="200" y="50" width="120" height="100" fill="#f5f5f5" stroke="#424242" stroke-width="2"/>
    <circle cx="260" cy="100" r="30" fill="#bdbdbd"/>
    <text x="260" y="90" text-anchor="middle" fill="#424242" font-family="Arial">Ground</text>
    <text x="260" y="110" text-anchor="middle" fill="#424242" font-family="Arial">Truth</text>

    <!-- Prediction Masks -->
    <rect x="350" y="50" width="120" height="100" fill="#f5f5f5" stroke="#424242" stroke-width="2"/>
    <circle cx="410" cy="100" r="35" fill="#bbdefb"/>
    <text x="410" y="90" text-anchor="middle" fill="#424242" font-family="Arial">U-Net</text>
    <text x="410" y="110" text-anchor="middle" fill="#424242" font-family="Arial">Prediction</text>

    <rect x="500" y="50" width="120" height="100" fill="#f5f5f5" stroke="#424242" stroke-width="2"/>
    <circle cx="560" cy="100" r="32" fill="#c8e6c9"/>
    <text x="560" y="90" text-anchor="middle" fill="#424242" font-family="Arial">PSPNet</text>
    <text x="560" y="110" text-anchor="middle" fill="#424242" font-family="Arial">Prediction</text>

    <rect x="650" y="50" width="120" height="100" fill="#f5f5f5" stroke="#424242" stroke-width="2"/>
    <circle cx="710" cy="100" r="33" fill="#ffcdd2"/>
    <text x="710" y="90" text-anchor="middle" fill="#424242" font-family="Arial">FPN</text>
    <text x="710" y="110" text-anchor="middle" fill="#424242" font-family="Arial">Prediction</text>
</svg>
