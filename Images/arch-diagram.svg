<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
    <!-- Input Image -->
    <rect x="50" y="150" width="100" height="100" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
    <text x="100" y="190" text-anchor="middle" fill="#1565c0" font-family="Arial">Input</text>
    <text x="100" y="210" text-anchor="middle" fill="#1565c0" font-family="Arial">Image</text>

    <!-- Encoder -->
    <path d="M 150 200 L 200 200" stroke="#1565c0" stroke-width="2"/>
    <rect x="200" y="125" width="150" height="150" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
    <text x="275" y="190" text-anchor="middle" fill="#1565c0" font-family="Arial">ResNet-34</text>
    <text x="275" y="210" text-anchor="middle" fill="#1565c0" font-family="Arial">Encoder</text>

    <!-- Decoder Variants -->
    <path d="M 350 200 L 400 200" stroke="#1565c0" stroke-width="2"/>
    <rect x="400" y="50" width="120" height="60" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
    <text x="460" y="85" text-anchor="middle" fill="#1565c0" font-family="Arial">U-Net</text>

    <rect x="400" y="120" width="120" height="60" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
    <text x="460" y="155" text-anchor="middle" fill="#1565c0" font-family="Arial">PSPNet</text>

    <rect x="400" y="190" width="120" height="60" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
    <text x="460" y="225" text-anchor="middle" fill="#1565c0" font-family="Arial">FPN</text>

    <rect x="400" y="260" width="120" height="60" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
    <text x="460" y="295" text-anchor="middle" fill="#1565c0" font-family="Arial">LinkNet</text>

    <rect x="400" y="330" width="120" height="60" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
    <text x="460" y="365" text-anchor="middle" fill="#1565c0" font-family="Arial">MANet</text>

    <!-- Output paths -->
    <path d="M 520 80 L 580 200" stroke="#1565c0" stroke-width="2"/>
    <path d="M 520 150 L 580 200" stroke="#1565c0" stroke-width="2"/>
    <path d="M 520 220 L 580 200" stroke="#1565c0" stroke-width="2"/>
    <path d="M 520 290 L 580 200" stroke="#1565c0" stroke-width="2"/>
    <path d="M 520 360 L 580 200" stroke="#1565c0" stroke-width="2"/>

    <!-- Output -->
    <rect x="580" y="150" width="100" height="100" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
    <text x="630" y="190" text-anchor="middle" fill="#1565c0" font-family="Arial">Segmentation</text>
    <text x="630" y="210" text-anchor="middle" fill="#1565c0" font-family="Arial">Mask</text>
</svg>
